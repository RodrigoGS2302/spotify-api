services:
  postgres:
    image: postgres:16
    container_name: spotify-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: spotifydb
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      TZ: America/Sao_Paulo

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d spotifydb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: